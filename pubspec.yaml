name: rtchat
description: RealtimeChat
publish_to: "none"

version: 1.0.0+4

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.8.1
  cloud_firestore: ^6.10.0
  cloud_functions: ^6.5.0
  firebase_analytics: ^12.6.0
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  firebase_crashlytics: ^5.4.0
  firebase_database: ^12.6.0
  flutter_custom_tabs: ^2.6.0
  flutter_keyboard_visibility: ^7.0.1
  flutter_localizations:
    sdk: flutter
  flutter_localized_locales: ^2.0.5
  flutter_tts: ^4.2.5
  flutter_web_auth_2: ^5.1.0
  intl: ^0.20.3
  linkify: ^5.0.0
  metadata_fetch: ^0.4.1
  mobile_scanner: ^7.4.2
  dchs_motion_sensors: ^3.0.0
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  qr_flutter: ^4.1.0
  streaming_shared_preferences: ^2.0.0
  sticky_headers: ^0.3.0+2
  styled_text: ^10.0.0
  url_launcher: ^6.3.3
  wakelock_plus: ^1.3.3
  webview_flutter: ^4.9.0
  webview_flutter_android: ^4.14.1
  webview_flutter_wkwebview: ^3.27.0
  uuid: ^4.6.0
  flutter_markdown_plus: ^1.0.12

dev_dependencies:
  leak_tracker_flutter_testing: any
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/
    - assets/providers/
