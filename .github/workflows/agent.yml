name: Build and Deploy Agent

on:
  push:
    paths:
      - "agent/**"
    branches:
      - main
  pull_request:
    paths:
      - "agent/**"
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.19"
          cache-dependency-path: agent/go.sum

      - uses: ./.github/actions/twitch-cli

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - run: go vet ./...

      - run: go test -race ./...

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/muxable/rtchat-agent
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./agent
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    needs: [test, build]
    concurrency:
      group: deploy
      cancel-in-progress: true
    environment:
      name: agent
      url: https://console.cloud.google.com/compute/instanceGroups/details/us-west1/agent-small-us-west1?project=rtchat-47692

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/832669896677/locations/global/workloadIdentityPools/github-actions/providers/github-actions'
          service_account: 'github-action-356868763@rtchat-47692.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to GCE
        id: deploy
        # the regional group spans three zones, so surge must be 0 or >= 3.
        # every instance joins every channel, so replacing them with surge
        # keeps chat flowing during the rollout.
        run: |
          gcloud compute instance-groups managed rolling-action replace agent-small-us-west1 \
            --project=rtchat-47692 --region=us-west1 \
            --max-surge=3 --max-unavailable=0
