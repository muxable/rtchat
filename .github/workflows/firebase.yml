name: Deploy to Firebase on merge
on:
  push:
    paths:
      - "database.rules.json"
      - ".firebaserc"
      - "firebase.json"
      - "firestore.indexes.json"
      - "firestore.rules"
    branches:
      - main
  workflow_dispatch:

# queue deploys so back-to-back merges don't race each other.
concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RTCHAT_47692 }}
      - run: npx -y firebase-tools@15.33.0 deploy --only "firestore,database" --project rtchat-47692 --non-interactive
