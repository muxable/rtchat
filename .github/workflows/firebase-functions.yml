name: Deploy to Firebase Functions on merge
on:
  push:
    paths:
      - "functions/**"
    branches:
      - main
  workflow_dispatch:

# queue deploys so back-to-back merges don't race each other.
concurrency:
  group: firebase-functions-deploy
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RTCHAT_47692 }}
      # functions.config() values are managed in the project with
      # `firebase functions:config:set`, not from CI, until they move to
      # params (#1409). the deploy reads them, which needs this experiment.
      - run: npx -y firebase-tools@15.33.0 deploy --only functions --project rtchat-47692 --non-interactive --force
        env:
          FIREBASE_CLI_EXPERIMENTS: legacyRuntimeConfigCommands
