name: iOS Swift Package Manager

on:
  pull_request:
    paths:
      - "ios/**"
      - "packages/on_device_tts/**"
      - "pubspec.*"
      - ".github/workflows/ios-spm.yml"
  workflow_dispatch:

jobs:
  archive:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Test framework validation
        run: python3 -m unittest discover -s ios/tool -v
      - name: Archive without signing
        run: flutter build ipa --release --no-codesign
      - name: Validate archived frameworks
        run: python3 ios/tool/validate_frameworks.py build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app
      - name: Confirm CocoaPods is not used
        run: test ! -e ios/Pods/Manifest.lock
