name: flutter analyze

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
      - run: flutter pub get
      # the analyzer resolves the package's files with its own dependencies.
      - run: flutter pub get
        working-directory: packages/on_device_tts
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Run flutter analyze
        uses: invertase/github-action-dart-analyzer@v3
      - name: Analyze on_device_tts
        run: flutter analyze
        working-directory: packages/on_device_tts
