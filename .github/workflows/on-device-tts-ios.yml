name: on_device_tts iOS

# Runs the plugin's Swift tests (the OnDeviceTtsCore Swift package) on the
# iOS simulator, with real Supertonic 3 synthesis through ONNX Runtime, and
# checks the frameworks embedded in the app's release build (ITMS-90208).

on:
  push:
    branches:
      - main
    paths:
      - "packages/on_device_tts/**"
      - "ios/**"
      - "pubspec.*"
      - ".github/scripts/check_embedded_frameworks.py"
      - ".github/workflows/on-device-tts-ios.yml"
  pull_request:
    paths:
      - "packages/on_device_tts/**"
      - "ios/**"
      - "pubspec.*"
      - ".github/scripts/check_embedded_frameworks.py"
      - ".github/workflows/on-device-tts-ios.yml"
  workflow_dispatch:

concurrency:
  group: on-device-tts-ios-${{ github.ref }}
  cancel-in-progress: true

env:
  # https://huggingface.co/Supertone/supertonic-3, pinned.
  SUPERTONIC_REVISION: 3cadd1ee6394adea1bd021217a0e650ede09a323
  MODEL_DIR: ${{ github.workspace }}/../supertonic-3

jobs:
  xctest:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Cache the Supertonic 3 model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.MODEL_DIR }}
          key: supertonic-3-${{ env.SUPERTONIC_REVISION }}

      - name: Download the Supertonic 3 model
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$MODEL_DIR/onnx" "$MODEL_DIR/voice_styles"
          base="https://huggingface.co/Supertone/supertonic-3/resolve/$SUPERTONIC_REVISION"
          while read -r sha file; do
            curl -fsSL --retry 3 "$base/$file" -o "$MODEL_DIR/$file"
            echo "$sha  $MODEL_DIR/$file" | shasum -a 256 -c -
          done <<'EOF'
          c3eb91414d5ff8a7a239b7fe9e34e7e2bf8a8140d8375ffb14718b1c639325db onnx/duration_predictor.onnx
          c7befd5ea8c3119769e8a6c1486c4edc6a3bc8365c67621c881bbb774b9902ff onnx/text_encoder.onnx
          42078d3aef1cd43ab43021f3c54f47d2d75ceb4e75f627f118890128b06a0d09 onnx/tts.json
          9bf7346e43883a81f8645c81224f786d43c5b57f3641f6e7671a7d6c493cb24f onnx/unicode_indexer.json
          883ac868ea0275ef0e991524dc64f16b3c0376efd7c320af6b53f5b780d7c61c onnx/vector_estimator.onnx
          085de76dd8e8d5836d6ca66826601f615939218f90e519f70ee8a36ed2a4c4ba onnx/vocoder.onnx
          bbdec6ee00231c2c742ad05483df5334cab3b52fda3ba38e6a07059c4563dbc2 voice_styles/F1.json
          7c722c6a72707b1a77f035d67f0d1351ba187738e06f7683e8c72b1df3477fc6 voice_styles/F2.json
          12f6ef2573baa2defa1128069cb59f203e3ab67c92af77b42df8a0e3a2f7c6ab voice_styles/F3.json
          c2fa764c1225a76dfc3e2c73e8aa4f70d9ee48793860eb34c295fff01c2e032b voice_styles/F4.json
          45966e73316415626cf41a7d1c6f3b4c70dbc1ba2bee5c1978ef0ce33244fc8d voice_styles/F5.json
          e35604687f5d23694b8e91593a93eec0e4eca6c0b02bb8ed69139ab2ea6b0a5b voice_styles/M1.json
          b76cbf62bac707c710cf0ae5aba5e31eea1a6339a9734bfae33ab98499534a50 voice_styles/M2.json
          ea1ac35ccb91b0d7ecad533a2fbd0eec10c91513d8951e3b25fbba99954e159b voice_styles/M3.json
          ca8eefad4fcd989c9379032ff3e50738adc547eeb5e221b82593a6d7b3bac303 voice_styles/M4.json
          dd22b92740314321f8ae11c5e87f8dd60d060f15dd3a632b5adf77f471f77af2 voice_styles/M5.json
          EOF

      - name: Resolve the Swift package
        working-directory: packages/on_device_tts/ios/on_device_tts/OnDeviceTtsCore
        run: |
          xcodebuild -resolvePackageDependencies
          xcodebuild -list

      - name: Pick a simulator
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted(devices, reverse=True):
              if "iOS" not in runtime:
                  continue
              for d in devices[runtime]:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"]); sys.exit()
          ')
          echo "SIMULATOR=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid" || true
          xcrun simctl list devices | grep "$udid"

      - name: Run the XCTests
        working-directory: packages/on_device_tts/ios/on_device_tts/OnDeviceTtsCore
        run: |
          status=0
          TEST_RUNNER_SUPERTONIC_MODEL_DIR="$MODEL_DIR" xcodebuild test \
            -scheme OnDeviceTtsCore -configuration Debug \
            -destination "id=$SIMULATOR" -parallel-testing-enabled NO \
            -skip-testing:OnDeviceTtsCoreTests/BenchmarkTests \
            > "$RUNNER_TEMP/xctest.log" 2>&1 || status=$?
          grep -E "^(Test (Case|Suite)|PARITY|SYNTH|SPEAK|STOP|on_device_tts:)|error:|\*\* " "$RUNNER_TEMP/xctest.log" || true
          if [ "$status" != 0 ]; then
            tail -n 200 "$RUNNER_TEMP/xctest.log"
            exit "$status"
          fi
          # Only the benchmark may be skipped: everything else needs the model.
          if grep -E "Test Case .* skipped" "$RUNNER_TEMP/xctest.log"; then
            echo "::error::tests were skipped"
            exit 1
          fi
          {
            echo '### Parity with the reference (supertonic PyPI)'
            echo '```'
            grep -E "^(PARITY|SYNTH|SPEAK|STOP)" "$RUNNER_TEMP/xctest.log" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Benchmark the execution providers
        continue-on-error: true
        working-directory: packages/on_device_tts/ios/on_device_tts/OnDeviceTtsCore
        run: |
          echo '### Execution providers (iOS simulator on a macOS runner, not a device)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          for provider in cpu coreml xnnpack; do
            TEST_RUNNER_SUPERTONIC_MODEL_DIR="$MODEL_DIR" TEST_RUNNER_SUPERTONIC_BENCHMARK="$provider" \
              xcodebuild test -scheme OnDeviceTtsCore -configuration Debug \
              -destination "id=$SIMULATOR" -parallel-testing-enabled NO \
              -only-testing:OnDeviceTtsCoreTests/BenchmarkTests > "$RUNNER_TEMP/bench-$provider.log" 2>&1 \
              || echo "BENCH provider=$provider failed (exit $?)"
            grep -E "^BENCH|on_device_tts:" "$RUNNER_TEMP/bench-$provider.log" || true
          done | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xctest-logs
          path: ${{ runner.temp }}/*.log

  # App Store Connect rejected a build that embedded onnxruntime.framework
  # with a binary minos (15.5) newer than its Info.plist MinimumOSVersion
  # (15.1): ITMS-90208. Builds the app like the release (unsigned) and checks
  # every embedded framework; see packages/on_device_tts/doc/ios.md.
  embedded-frameworks:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The same toolchain as the release build (muxable/.github flutter-ios.yml).
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: flutter build ios
        run: |
          pod repo update
          flutter pub get
          flutter build ios --release --no-codesign
          # pod install adds missing pods to the lock file; show it if it did.
          git diff --exit-code ios/Podfile.lock || echo "::warning::ios/Podfile.lock is out of date (diff above)"

      - name: Check the embedded frameworks
        run: |
          python3 -I .github/scripts/check_embedded_frameworks.py \
            build/ios/iphoneos/Runner.app --require-string N11onnxruntime3EnvE \
            | tee -a "$GITHUB_STEP_SUMMARY"
