name: Deploy to Firebase Hosting on merge
on:
  push:
    paths:
      - "public/**"
      # rewrites to functions live in firebase.json.
      - "firebase.json"
    branches:
      - main
  workflow_dispatch:

# queue deploys so back-to-back merges don't race each other.
concurrency:
  group: firebase-hosting-deploy
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RTCHAT_47692 }}
      - run: npx -y firebase-tools@15.33.0 deploy --only hosting --project rtchat-47692 --non-interactive
