name: Check Firebase Functions build
on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/twitch-cli
      - run: npm ci && npm run build && npm test
        working-directory: functions
