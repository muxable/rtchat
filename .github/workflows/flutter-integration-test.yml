name: flutter integration test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: integration-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The Firestore emulator requires Java 21.
      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # downloading the emulator jars occasionally fails mid-transfer, so cache
      # them and retry the download before booting the android emulator.
      - name: Cache Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-15.34.1
      - name: Download Firebase emulators
        run: |
          for emulator in firestore database; do
            for attempt in 1 2 3; do
              npx -y firebase-tools@15.34.1 setup:emulators:$emulator && break
              [ $attempt = 3 ] && exit 1
              sleep 10
            done
          done
      - name: Run integration tests against Firebase emulators
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: npx -y firebase-tools@15.34.1 emulators:exec --only auth,firestore,database --project rtchat-47692 "bash .github/scripts/integration-test.sh"
