name: flutter integration test

on:
  push:
    branches:
      - main
  pull_request:
    # skip PRs that only touch the backend or docs.
    paths-ignore:
      - "agent/**"
      - "functions/**"
      - "auxiliary/**"
      - "**.md"
      - ".github/workflows/agent.yml"
      - ".github/workflows/auxiliary.yml"
      - ".github/workflows/firebase*.yml"
  workflow_dispatch:

# cancel superseded PR runs; runs on main queue instead.
concurrency:
  group: integration-test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The Firestore emulator requires Java 21.
      - uses: actions/setup-java@v6
        with:
          distribution: "zulu"
          java-version: "21"
      # the app's Gradle build runs inside the emulator step via flutter.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # downloading the emulator jars occasionally fails mid-transfer, so cache
      # them and retry the download before booting the android emulator.
      - name: Cache Firebase emulators
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-15.34.1
      - name: Download Firebase emulators
        run: |
          for emulator in firestore database; do
            for attempt in 1 2 3; do
              npx -y firebase-tools@15.34.1 setup:emulators:$emulator && break
              [ $attempt = 3 ] && exit 1
              sleep 10
            done
          done
      # boot from a cached AVD snapshot instead of cold booting, per
      # https://github.com/ReactiveCircus/android-emulator-runner#usage--examples
      - name: Cache AVD
        id: avd-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-35-google_apis-x86_64
      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: echo "Generated AVD snapshot for caching."
      - name: Run integration tests against Firebase emulators
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: npx -y firebase-tools@15.34.1 emulators:exec --only auth,firestore,database --project rtchat-47692 "bash .github/scripts/integration-test.sh"
