name: on_device_tts
description: >-
  Text-to-speech engines that run on the device behind one interface:
  the platform's system voices today, neural voices later.
version: 0.1.0
publish_to: "none"

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  # 4.4 and later came out days ago; widen once they have settled.
  archive: ">=4.0.7 <4.4.0"
  crypto: ^3.0.6
  flutter:
    sdk: flutter
  flutter_tts: ^4.2.5
  http: ^1.2.2
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
