name: on_device_tts
description: >-
  Text-to-speech engines that run on the device behind one interface:
  the platform's system voices, and neural voices on flutter_onnx.
version: 0.1.0
publish_to: "none"

environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter_onnx:
    git:
      url: https://github.com/kevmo314/flutter_onnx.git
      ref: 7b0c91a8315eca416692a6013c0169288dbe3797
  flutter_onnx_cpu:
    git:
      url: https://github.com/kevmo314/flutter_onnx.git
      path: cpu
      ref: 7b0c91a8315eca416692a6013c0169288dbe3797
  background_downloader: ^9.6.4
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  path_provider: ^2.1.6
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.muxable.ondevicetts
        pluginClass: OnDeviceTtsPlugin
      ios:
        pluginClass: OnDeviceTtsPlugin
