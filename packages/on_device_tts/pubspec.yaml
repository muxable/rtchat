name: on_device_tts
description: >-
  Text-to-speech engines that run on the device behind one interface:
  the platform's system voices, and neural voices on ONNX Runtime.
version: 0.1.0
publish_to: "none"

environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  # 9.6.4 came out last week.
  background_downloader: ">=9.6.3 <9.6.4"
  crypto: ^3.0.6
  flutter:
    sdk: flutter
  flutter_tts: ^4.2.5
  just_audio: ^0.10.6
  path_provider: ^2.1.6
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.muxable.ondevicetts
        pluginClass: OnDeviceTtsPlugin
      ios:
        pluginClass: OnDeviceTtsPlugin
