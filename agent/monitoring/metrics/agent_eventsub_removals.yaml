description: Twitch EventSub queue removals for deauthorized broadcasters, by outcome.
filter: >-
  resource.type="gce_instance"
  logName="projects/rtchat-47692/logs/cos_containers"
  jsonPayload.message="twitch eventsub remove"
labelExtractors:
  outcome: EXTRACT(jsonPayload.outcome)
metricDescriptor:
  metricKind: DELTA
  valueType: INT64
  unit: "1"
  labels:
  - key: outcome
